name: 버그 신고
description: 파이프라인이 문서대로 동작하지 않는 경우
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        이 저장소는 실행 환경에 따라 결과가 달라지는 부분이 많습니다.
        환경 정보를 함께 적어주시면 재현이 빨라집니다.

  - type: dropdown
    id: stage
    attributes:
      label: 어느 단계인가요
      options:
        - "1. 크롤 (crawl4ai)"
        - "2. 캡처 (Playwright)"
        - "3. OCR (tesseract)"
        - "api/ 공식 OpenAPI 조회"
        - "run_pipeline.sh 또는 docker compose"
        - "문서"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 무엇이 일어났나요
      description: 실행한 명령과 그 출력을 그대로 붙여주세요. 인증키는 지워주세요.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 무엇을 기대했나요
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: "`docker version` 과 `python3 --version` 출력, OS와 아키텍처"
      placeholder: |
        Docker 29.6.2
        Python 3.13.1
        macOS 15.6 arm64
      render: shell
    validations:
      required: true

  - type: textarea
    id: images
    attributes:
      label: 컨테이너 이미지 버전
      description: |
        로컬에 받아둔 이미지 태그는 `docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}'` 로
        확인할 수 있습니다. 이 중 crawl4ai만 버전 태그 없이 `latest` 로 고정돼 있어(README
        "품질과 한계" 절 참고) 이미지가 갱신되면 동작이 달라질 수 있습니다. 그래서 실제로
        떠 있던 crawl4ai 버전이 가장 중요합니다. 컨테이너 시작 로그에 찍히거나,
        `curl -H 'Authorization: Bearer $CRAWL4AI_API_TOKEN' http://localhost:11235/health`
        응답의 `version` 필드로도 확인할 수 있습니다. 컨테이너가 이미 내려갔다면 비워두셔도
        됩니다.
      placeholder: |
        crawl4ai: latest (health 응답 version 0.9.2)
        capture: mcr.microsoft.com/playwright/python:v1.62.0-noble
        ocr: jitesoft/tesseract-ocr:5.5.2
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 같은 버그를 다루는 기존 이슈가 없는지 확인했습니다
        - label: 붙여넣은 출력에서 인증키나 토큰을 지웠습니다
