<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110" role="img" aria-labelledby="dartcatcher-logo-title">
  <title id="dartcatcher-logo-title">dartcatcher</title>

  <!-- 마크. assets/brand/dartcatcher-mark.svg 와 같은 도형을 락업 좌측에 배치했다. -->
  <g transform="translate(8 8) scale(0.97)">
    <!-- 화면 프레임. 아래 모서리 한 구간이 열려 있다. -->
    <path d="M25 10 H69 A6 6 0 0 1 75 16 V42 A6 6 0 0 1 69 48 H61
             M51 48 H25 A6 6 0 0 1 19 42 V16 A6 6 0 0 1 25 10"
          fill="none" stroke="#1F3A5F" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M28 21 H66 M28 29 H58 M28 37 H62"
          fill="none" stroke="#4A7BA7" stroke-width="3" stroke-linecap="round"/>
    <rect x="51" y="52" width="9.5" height="9.5" rx="2"
          transform="rotate(24 55.75 56.75)" fill="#E8A33D"/>
    <path d="M31 68 H81" fill="none" stroke="#1F3A5F" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M34 69 L52 88 H60 L78 69"
          fill="none" stroke="#1F3A5F" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M41 75 H71 M47 82 H65"
          fill="none" stroke="#4A7BA7" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 워드마크. 폰트를 임베드하지 않고 읽는 쪽 UI 산세리프로 그린다. 그래서 자형은
       보는 환경에 따라 달라진다. 자형까지 고정해야 하는 자리(파비콘, 소셜 프리뷰,
       인쇄물)에는 글자가 없는 dartcatcher-mark.svg 를 쓴다.
       textLength 로 폭을 고정하는 방법은 쓰지 않았다. 렌더러가 이 속성을 무시하면
       글자가 뷰박스를 넘어 잘리기 때문이다. 대신 자연 폭이 여유 있게 들어가는
       크기를 골랐다. -->
  <text x="126" y="68" text-anchor="start"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="600" fill="#1F3A5F">dartcatcher</text>
</svg>
