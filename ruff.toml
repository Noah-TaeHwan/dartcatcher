# dartcatcher lint 설정
#
# 이 저장소는 표준 라이브러리만 쓰는 얇은 실행 스크립트 모음이다. 검사 범위를
# 문법 오류와 미사용 심볼 수준으로 좁게 잡는다. 스타일 통일은 이 프로젝트가
# 풀려는 문제가 아니며, 규칙을 넓히려고 동작하는 코드를 고치지 않는다.
#
# 참고: ruff 0.16.1 기준 설정 파일이 없을 때의 기본 select는 E4/E7/E9/F보다
# 훨씬 넓다(EXE001, DTZ007, PLW1510, FURB105, I001 등 포함). 아래 select는
# 이 저장소가 실제로 원하는 범위(임포트·문장·문법 오류·미사용 심볼)로 명시적으로
# 좁힌 것이다.

target-version = "py313"
line-length = 100

exclude = [
    "data",
    "evidence",
    "ocr/tessdata",
]

[lint]
# E4 임포트, E7 문장, E9 문법 오류, F pyflakes
select = ["E4", "E7", "E9", "F"]
